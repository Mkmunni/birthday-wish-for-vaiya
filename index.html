<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Bhaiya! ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background: #090d16;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
            cursor: pointer;
            color: #ffffff;
            perspective: 1200px;
            padding: 15px;
        }

        .ambient-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.6;
            z-index: 0;
            animation: floatGlow 6s infinite alternate ease-in-out;
        }
        .glow-1 { background: #ff4d6d; top: -5%; left: -5%; }
        .glow-2 { background: #4cc9f0; bottom: -5%; right: -5%; animation-delay: -3s; }

        @keyframes floatGlow {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.2) translate(30px, 30px); }
        }

        #fireworksCanvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 5;
            pointer-events: none;
        }

        .card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 850px;
            background: rgba(17, 24, 39, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7),
                        0 0 30px rgba(255, 77, 109, 0.2);
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .header-tag {
            align-self: flex-start;
            background: rgba(255, 77, 109, 0.2);
            color: #ff758f;
            border: 1px solid rgba(255, 117, 143, 0.4);
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .main-layout {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 30px;
            margin: 25px 0;
        }

        .text-side { flex: 1; }

        .photo-side {
            width: 240px;
            height: 280px;
            perspective: 1000px;
            position: relative;
            flex-shrink: 0;
        }

        .photo-wrapper {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: swing 4s infinite ease-in-out alternate;
        }

        @keyframes swing {
            0% { transform: rotate(-3deg) translateY(0px); }
            100% { transform: rotate(3deg) translateY(-10px); }
        }

        .photo-wrapper.flip-animate {
            animation: flipPhoto 0.8s ease-in-out;
        }

        @keyframes flipPhoto {
            0% { transform: scale(1) rotateY(0deg); }
            50% { transform: scale(0.8) rotateY(180deg); }
            100% { transform: scale(1) rotateY(360deg); }
        }

        .photo-frame {
            width: 100%;
            height: 100%;
            border-radius: 20px;
            object-fit: cover; /* এটি ছবি চ্যাপ্টা হওয়া প্রতিরোধ করবে */
            border: 4px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 15px 30px rgba(0,0,0,0.5),
                        0 0 20px rgba(255, 77, 109, 0.5);
        }

        /* Candle Lighting Section */
        .candle-container {
            display: none;
            position: relative;
            margin: 20px 0;
            cursor: pointer;
            width: fit-content;
        }
        .candle-container.show { display: block; }

        .candle-flame {
            width: 16px;
            height: 26px;
            background: #ff9e00;
            border-radius: 50% 50% 20% 20%;
            position: absolute;
            top: -20px;
            left: 22px;
            box-shadow: 0 0 15px #ff9e00, 0 0 25px #ff0000;
            animation: flicker 0.8s infinite alternate;
        }

        @keyframes flicker {
            0% { transform: scale(1) rotate(-2deg); opacity: 0.9; }
            100% { transform: scale(1.15) rotate(2deg); opacity: 1; }
        }

        .candle-flame.off { display: none; }

        .candle-body {
            font-size: 45px;
        }

        /* Multiple Gift Container */
        .multi-gift-container {
            display: none;
            gap: 20px;
            margin-top: 20px;
        }
        .multi-gift-container.show { display: flex; }

        .gift-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            cursor: pointer;
        }

        .box-icon {
            font-size: 45px;
            transition: transform 0.3s;
            animation: bounce 1.5s infinite alternate;
        }
        .gift-wrapper:hover .box-icon { transform: scale(1.2); }

        @keyframes bounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-8px); }
        }

        .gift-content {
            position: absolute;
            top: -45px;
            font-size: 38px;
            opacity: 0;
            transform: scale(0.2) translateY(20px);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
        }

        .gift-wrapper.opened .gift-content {
            opacity: 1;
            transform: scale(1.2) translateY(-10px);
        }

        .gift-label {
            font-size: 11px;
            color: #ffd166;
            font-weight: 600;
            margin-top: 4px;
        }

        .typing-text {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff, #ff758f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
            line-height: 1.2;
        }

        .sub-message {
            font-size: 15px;
            color: #d1d5db;
            line-height: 1.6;
            min-height: 50px;
        }

        .tap-hint {
            align-self: center;
            background: linear-gradient(135deg, #ff4d6d, #c9184a);
            padding: 12px 32px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
            box-shadow: 0 0 25px rgba(255, 77, 109, 0.6);
            transition: all 0.3s ease;
            text-align: center;
        }

        .tap-hint:hover {
            transform: scale(1.05);
            box-shadow: 0 0 35px rgba(255, 77, 109, 0.9);
        }

        /* 📱 Mobile Responsive Media Query */
        @media (max-width: 768px) {
            .card {
                padding: 24px 20px;
            }

            .main-layout {
                flex-direction: column-reverse; /* ছবি ওপরে, লেখা নিচে থাকবে */
                text-align: center;
                gap: 20px;
            }

            .header-tag {
                align-self: center;
                font-size: 11px;
            }

            .photo-side {
                width: 200px;
                height: 230px;
            }

            .typing-text {
                font-size: 24px;
            }

            .sub-message {
                font-size: 14px;
            }

            .candle-container {
                margin: 15px auto;
            }

            .multi-gift-container {
                justify-content: center;
            }

            .tap-hint {
                width: 100%;
                font-size: 13px;
                padding: 12px 20px;
            }
        }
    </style>
</head>
<body>

    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>

    <audio id="bgMusic" loop>
        <source src="birthday.mp3" type="audio/mpeg">
    </audio>

    <canvas id="fireworksCanvas"></canvas>

    <div class="card">
        <div class="header-tag" id="tag">20 SEPTEMBER - A SPECIAL DAY</div>
        
        <div class="main-layout">
            <div class="text-side">
                <div class="typing-text" id="typeArea">Tap anywhere to start...</div>
                <div class="sub-message" id="subText">Click on the screen to view the birthday surprises!</div>
                
                <!-- Candle Blowing Section -->
                <div class="candle-container" id="candleBox" onclick="blowCandle(event)">
                    <div class="candle-flame" id="flame"></div>
                    <div class="candle-body">🎂</div>
                </div>

                <!-- Multiple Interactive Gifts -->
                <div class="multi-gift-container" id="giftsBox">
                    <div class="gift-wrapper" onclick="revealGift(this, '💐 Bouquet', event)">
                        <div class="gift-content">💐</div>
                        <div class="box-icon">🎁</div>
                        <span class="gift-label">Flowers</span>
                    </div>
                    <div class="gift-wrapper" onclick="revealGift(this, '🎂 Birthday Cake', event)">
                        <div class="gift-content">🎂</div>
                        <div class="box-icon">🎁</div>
                        <span class="gift-label">Cake</span>
                    </div>
                    <div class="gift-wrapper" onclick="revealGift(this, '👑 Best Mentor Crown', event)">
                        <div class="gift-content">👑</div>
                        <div class="box-icon">🎁</div>
                        <span class="gift-label">Crown</span>
                    </div>
                </div>
            </div>

            <div class="photo-side">
                <div class="photo-wrapper" id="photoWrapper">
                    <img src="pic1.jpg" id="bhaiyaPhoto" class="photo-frame" alt="Bhaiya Photo">
                </div>
            </div>
        </div>

        <div class="tap-hint" id="tapBtn">👇 Tap anywhere on screen to begin</div>
    </div>

    <script>
        let step = 0;
        let isFireworksRunning = false;
        const audio = document.getElementById('bgMusic');

        const steps = [
            {
                tag: "20 SEPTEMBER - A SPECIAL DAY",
                title: "Happy Birthday, Bhaiya! 🎉",
                sub: "Today is 20th September — celebrating the birthday of my favorite person and best mentor in life!",
                image: "pic1.jpg",
                btn: "👉 Tap for Next Surprise",
                candle: false,
                gifts: false
            },
            {
                tag: "BEST BROTHER EVER ❤️",
                title: "Wishing You Endless Joy 🌟",
                sub: "Thank you for always guiding, supporting, and standing by me through every situation.",
                image: "pic2.jpg",
                btn: "👉 Tap for Next Wish",
                candle: false,
                gifts: false
            },
            {
                tag: "MEMORIES & SMILES ✨",
                title: "Always Stay Happy 😊",
                sub: "May your life be filled with success, laughter, and unforgettable moments!",
                image: "pic3.jpg",
                btn: "👉 See Next Wish",
                candle: false,
                gifts: false
            },
            {
                tag: "INSPIRATION & STRENGTH 💪",
                title: "My Role Model Forever 🏆",
                sub: "You are not just my brother, but my biggest inspiration. Keep shining bright!",
                image: "pic4.jpg",
                btn: "👉 Tap for Celebration",
                candle: false,
                gifts: false
            },
            {
                tag: "CELEBRATION TIME 🎂",
                title: "Time to Blow Candles! 🕯️",
                sub: "Tap on the Birthday Cake below to blow out the candle and make a wish!",
                image: "pic5.jpg",
                btn: "👉 Tap for Final Surprises 🎁",
                candle: true,
                gifts: false
            },
            {
                tag: "20TH SEPTEMBER CELEBRATION 🥳",
                title: "Have a Magical Year Ahead! ✨",
                sub: "Tap on the Gift Boxes below to reveal special surprises for you, Bhaiya!",
                image: "pic6.jpg",
                btn: "✨ Enjoy Music & Celebrations ✨",
                candle: false,
                gifts: true
            }
        ];

        let typingInterval;

        function typeWriter(text, elementId, speed = 35) {
            let i = 0;
            const elem = document.getElementById(elementId);
            elem.innerHTML = "";
            clearInterval(typingInterval);

            typingInterval = setInterval(() => {
                if (i < text.length) {
                    elem.innerHTML += text.charAt(i);
                    i++;
                } else {
                    clearInterval(typingInterval);
                }
            }, speed);
        }

        document.body.addEventListener('click', (e) => {
            if (e.target.closest('#giftsBox') || e.target.closest('#candleBox')) return;

            if (step === 0) {
                audio.play().catch(err => console.log("Audio play error:", err));
            }

            if (step < steps.length) {
                let current = steps[step];

                const wrapper = document.getElementById('photoWrapper');
                wrapper.classList.remove('flip-animate');
                void wrapper.offsetWidth; 
                wrapper.classList.add('flip-animate');

                setTimeout(() => {
                    document.getElementById('bhaiyaPhoto').src = current.image;
                }, 300);

                document.getElementById('tag').innerText = current.tag;
                typeWriter(current.title, 'typeArea');
                document.getElementById('subText').innerText = current.sub;
                document.getElementById('tapBtn').innerText = current.btn;

                // Candle toggle
                const candleBox = document.getElementById('candleBox');
                if (current.candle) {
                    candleBox.classList.add('show');
                } else {
                    candleBox.classList.remove('show');
                }

                // Gifts toggle
                const giftsBoxElem = document.getElementById('giftsBox');
                if (current.gifts) {
                    giftsBoxElem.classList.add('show');
                    if (!isFireworksRunning) {
                        startFireworks();
                        triggerConfetti();
                        isFireworksRunning = true;
                    }
                } else {
                    giftsBoxElem.classList.remove('show');
                }

                step++;
            }
        });

        function blowCandle(event) {
            event.stopPropagation();
            const flame = document.getElementById('flame');
            flame.classList.add('off');
            triggerConfetti();
            document.getElementById('subText').innerText = "Make a wish! 🕯️✨ Candle blown out!";
        }

        function revealGift(element, giftName, event) {
            event.stopPropagation();
            if(!element.classList.contains('opened')) {
                element.classList.add('opened');
                createFirework(event.clientX, event.clientY);
                triggerConfetti();
                document.getElementById('subText').innerText = "You unlocked: " + giftName + "! ❤️✨";
            }
        }

        function triggerConfetti() {
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 80,
                    spread: 60,
                    origin: { y: 0.6 }
                });
            }
        }

        const fwCanvas = document.getElementById('fireworksCanvas');
        const fwCtx = fwCanvas.getContext('2d');
        fwCanvas.width = window.innerWidth;
        fwCanvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            fwCanvas.width = window.innerWidth;
            fwCanvas.height = window.innerHeight;
        });

        let particles = [];

        function createFirework(x, y) {
            const count = 40;
            const colors = ['#ff4d6d', '#ffd166', '#06d6a0', '#4cc9f0', '#ffb3c1', '#ffffff'];
            for (let i = 0; i < count; i++) {
                const angle = (Math.PI * 2 / count) * i;
                const speed = Math.random() * 5 + 2;
                particles.push({
                    x: x, y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    alpha: 1,
                    color: colors[Math.floor(Math.random() * colors.length)]
                });
            }
        }

        function startFireworks() {
            setInterval(() => {
                const rx = Math.random() * fwCanvas.width * 0.8 + fwCanvas.width * 0.1;
                const ry = Math.random() * fwCanvas.height * 0.5 + 50;
                createFirework(rx, ry);
            }, 600);
            animateFireworks();
        }

        function animateFireworks() {
            fwCtx.clearRect(0, 0, fwCanvas.width, fwCanvas.height);
            particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.015;

                fwCtx.save();
                fwCtx.globalAlpha = p.alpha;
                fwCtx.fillStyle = p.color;
                fwCtx.beginPath();
                fwCtx.arc(p.x, p.y, 3, 0, Math.PI * 2);
                fwCtx.fill();
                fwCtx.restore();

                if (p.alpha <= 0) particles.splice(index, 1);
            });
            requestAnimationFrame(animateFireworks);
        }
    </script>
</body>
</html>
